[project]
name = "SelfCU"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.6"
dependencies = [
    "accelerate>=1.12.0",
    "android-world>=0.1.0",
    "anthropic>=0.77.0",
    "cleanrl[atari]>=2.0.0b1",
    "click>=8.3.1",
    "einops>=0.8.2",
    "flash-linear-attention>=0.5.2",
    "gameboy-worlds>=0.1.0",
    "gdown>=6.0.0",
    "huggingface-hub>=1.3.7",
    "lxml>=6.1.3",
    "numpy>=2.4.2",
    "openai>=2.16.0",
    "opencv-python-headless>=5.0.0.93",
    "pandas>=3.0.0",
    "peft>=0.18.1",
    "pillow>=11.3.0",
    "protobuf>=6.33.5",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "selenium==4.15.2",
    "sentencepiece>=0.2.1",
    "tabulate>=0.10.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.67.2",
    "transformers==5.6.2",
]

[tool.uv.sources]
gameboy-worlds = { path = "../GameBoyRL/GameBoyWorlds", editable = true }
cleanrl = { path = "../GameBoyRL/cleanrl", editable = true }
android-world = { path = "../android_world", editable = true }

[tool.uv]
# android_world pins an old stack (numpy 1.26, pandas 2.1, protobuf 5) that
# conflicts with GameBoyRL. These overrides replace every package's
# requirement on the named dependency, so android_world runs on GameBoyRL's
# versions. android_world was validated on its own pins; re-validate after.
override-dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "protobuf>=6.33.5",
    "jsonschema>=4.17.3",
    "android-env>=1.2.3",
    "grpcio-tools>=1.71.0",
    # Needs protobuf<6. Only used by android_world's Gemini wrapper, which is
    # imported at the top of agents/infer.py (needs a lazy-import patch).
    "google-generativeai; sys_platform == 'never'",
    # Same cv2 module as opencv-python-headless; the non-headless build needs
    # libGL, which compute nodes may not have. Keep only the headless build.
    "opencv-python; sys_platform == 'never'",
]
