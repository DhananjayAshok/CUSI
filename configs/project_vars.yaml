random_seed: 42
max_batch_size_api: 32 # Default max batch size for API-backed models (OpenAI, Anthropic, OpenRouter, etc.) - caps concurrent in-flight requests per infer() chunk. Can be overridden by individual calls to infer().
max_batch_size_vllm: 32 # Default max batch size for vLLM-served models - caps concurrent in-flight requests sent to the vLLM server per infer() chunk. Can be overridden by individual calls to infer().
max_batch_size_huggingface: 32 # Default max batch size for local HuggingFace models - the number of samples run through the model in a single forward pass. Can be overridden by individual calls to infer().
default_max_queries_per_minute: 60 # Fallback rate limit (queries/minute) for API models whose name isn't in _RATE_LIMITS in cusi/utils/lm_inference.py
figure_skip_show: False # Indicates whether the Plotter object should save a figure or display it. In envs with no display you'll want to set this to True
WANDB_PROJECT: "CU" # This is more for bash than for within python. Will set the wandb logger to the right project
vllm_port: 8000 # The one place the vLLM port is set: scripts/serve_vllm.sh serves on it and vLLM_base_url is derived from it (override per run with --port / --vllm_port)
vllm_max_model_len: 32768 # --max-model-len for the vLLM server
vllm_max_images: 16 # --limit-mm-per-prompt image count for the vLLM server (judge describe slices send 10 frames)
# WebVoyager sites excluded from train and test (web_name values, comma-separated; read only through
# cusi.envs.webvoyager.excluded_sites()). Amazon, Google Search, Cambridge Dictionary, Allrecipes: bot
# protection blocks them (plans/web_voyager_plan.md). BBC News (added 2026-10-06): its cookie modal can't be
# clicked (a WebVoyager element-mapping bug), so every agent scores 0 there; remove it once that is fixed.
web_excluded_sites: "Amazon,Google Search,Cambridge Dictionary,Allrecipes,BBC News"
